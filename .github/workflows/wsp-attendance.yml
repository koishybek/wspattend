name: WSP авто-отметка

# Бесплатный вариант: GitHub включает бота сам к каждой паре по расписанию (server/schedule.json),
# он логинится, сидит на странице до конца блока пар и жмёт «Отметиться» каждый раз, когда
# она появляется (опрос каждые 0,5 с). Ноут не нужен.
#
# ВРЕМЯ В КРОНАХ — UTC. Алматы = UTC+5, поэтому UTC = время_Алматы − 5 часов.
# Каждый крон стоит на «начало блока минус 25 минут»: планировщик GitHub опаздывает на 5–20 мин,
# а отметка может открыться в первые минуты пары. Сколько следить — бот считает сам из schedule.json.
# Пары подряд склеены в один блок, чтобы не было двух параллельных входов.

on:
  workflow_dispatch:            # ручной запуск для теста
    inputs:
      mode:
        description: "watch — следить и жать; dump — войти и показать кнопки (без клика)"
        type: choice
        options: [watch, dump]
        default: watch
      minutes:
        description: "Сколько минут следить (для watch)"
        default: "5"
  schedule:
    - cron: "35 6 * * 1"        # Пн 11:35 Алматы  → INFT3105 + LAN11112  12:00–15:00
    - cron: "35 10 * * 1"       # Пн 15:35         → INFT3107             16:00–19:00
    - cron: "35 2 * * 2"        # Вт 07:35         → CSCI1404             08:00–10:00
    - cron: "35 7 * * 2"        # Вт 12:35         → CSCI1404 практика    13:00–14:00
    - cron: "35 8 * * 3"        # Ср 13:35         → LAN11112 + CSCI2208  14:00–18:00
    - cron: "35 3 * * 5"        # Пт 08:35         → INFT3106             09:00–12:00
    - cron: "35 8 * * 5"        # Пт 13:35         → LAN11112             14:00–15:00
    - cron: "35 3 * * 0"        # Вс 08:35         → INFT3105             09:00–10:00

jobs:
  otmetit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-jammy
    timeout-minutes: 300        # самый длинный блок: Ср 13:35–18:03 (~4.5ч)
    steps:
      - uses: actions/checkout@v4

      - name: install deps
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: watch & click
        working-directory: server
        env:
          WSP_LOGIN: ${{ secrets.WSP_LOGIN }}
          WSP_PASSWORD: ${{ secrets.WSP_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TARGET_STEMS: "отметит,отметь,белгілен"
          # жать каждый раз, когда кнопка появляется (отметка может быть на каждой паре блока)
          CLICK_ONCE: "false"
          # по расписанию — читаем schedule.json; вручную — просто следим N минут
          SCHEDULE_JSON: ${{ github.event_name == 'schedule' && 'schedule.json' || '' }}
          MAX_MINUTES: ${{ github.event_name == 'workflow_dispatch' && inputs.minutes || '0' }}
          DUMP: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dump' && '1' || '' }}
        run: node bot.mjs

      # на скринах личные данные — в публичном репо артефакты может скачать любой,
      # поэтому грузим только если репо приватный (в Telegram скрины уходят в любом случае)
      - name: upload screenshots
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: server/*.png
          if-no-files-found: ignore
          retention-days: 3
